[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "flowspeech-sdk"
version = "0.2.0"
description = "Python SDK for FlowSpeech public API v1 text to speech"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "FlowSpeech" }]
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://flowspeech.io/"
Documentation = "https://flowspeech.io/docs/public-api"
Repository = "https://github.com/waeckerlinfederowicz66-sketch/flowspeech-sdk"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/flowspeech_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/flowspeech_sdk", "tests", "README.md", "CHANGELOG.md", "PROVENANCE.md", "pyproject.toml", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
